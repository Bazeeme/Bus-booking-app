

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBus | Bus Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>EasyBus</h1>
        <p>Book your journey with ease</p>
    </header>

    <main class="container">
        <section class="booking-card">
            <h2>Book Your Bus Ticket</h2>
            <p class="subtitle">Enter your passenger and journey details.</p>

            <form id="bookingForm">
                <label for="name">Passenger Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name"
                       maxlength="100" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       maxlength="254" required>

                <label for="age">Age</label>
                <input type="number" id="age" name="age"
                       min="1" max="120"
                       placeholder="Enter your age" required>

                <label for="departureDate">Departure Date</label>
                <input type="date" id="departureDate"
                       name="departureDate" required>

                <label for="source">Source</label>
                <input type="text" id="source" name="source"
                       placeholder="e.g. Chennai"
                       maxlength="100" required>

                <label for="destination">Destination</label>
                <input type="text" id="destination" name="destination"
                       placeholder="e.g. Madurai"
                       maxlength="100" required>

                <button type="submit" id="bookButton">
                    Book Ticket
                </button>
            </form>

            <p id="statusMessage" role="status" aria-live="polite"></p>

            <section id="confirmation" class="confirmation" hidden>
                <h2>Booking Confirmed!</h2>
                <p>Your booking has been saved successfully.</p>
                <div id="bookingDetails"></div>
                <button type="button" id="newBookingButton">
                    Book Another Ticket
                </button>
            </section>
        </section>
    </main>

    <footer>EasyBus | Bus Ticket Booking Project</footer>
    <script src="app.js"></script>
</body>
</html>
